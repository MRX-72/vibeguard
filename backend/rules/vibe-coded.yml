# VibeGuard's taint rules (§7): user input that provably reaches a dangerous sink in the same function.
# A hit here is "Confirmed reachable". Report text lives in scanners/custom_rules.py (CATALOG), keyed by metadata.vibe.
# Structural rules (no data flow needed) are ast-grep rules in rules/ast-grep/rules/; file checks are Python.
rules:
  - id: vibe.sql-string-concat
    message: Request data is concatenated into a SQL query
    severity: ERROR
    languages: [javascript, typescript]
    metadata: {vibe: sql-string-concat}
    mode: taint
    pattern-sources: &request
      - patterns:
          - pattern-either:
              - pattern: $REQ.query
              - pattern: $REQ.body
              - pattern: $REQ.params
              - pattern: $REQ.headers
              - pattern: $REQ.cookies
          - metavariable-regex: {metavariable: $REQ, regex: ^(req|request|ctx\.request|event)$}
      - pattern: $REQ.json()
      - pattern: $REQ.formData()
      - pattern: $REQ.text()
      - pattern: $C.req.query(...)
      - pattern: $C.req.param(...)
      - pattern: $C.req.json()
      - pattern: $REQ.nextUrl.searchParams
      - pattern: new URL($REQ.url).searchParams
      - pattern: useSearchParams()
      - pattern: useParams()
      - pattern: new URLSearchParams(...)
      - pattern: window.location
      - pattern: location.search
      - pattern: location.hash
    pattern-sanitizers: &numbers
      - pattern: parseInt(...)
      - pattern: parseFloat(...)
      - pattern: Number(...)
      - pattern: $X.escape(...)
      - pattern: escape(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $DB.query($SQL, ...)
              - pattern: $DB.execute($SQL, ...)
              - pattern: $DB.raw($SQL, ...)
              - pattern: $DB.unsafe($SQL, ...)
              - pattern: $DB.exec($SQL, ...)
              - pattern: $DB.prepare($SQL, ...)
              - pattern: $DB.$queryRawUnsafe($SQL, ...)
              - pattern: $DB.$executeRawUnsafe($SQL, ...)
          - focus-metavariable: $SQL
      - patterns:  # PostgREST filter strings: .or(`name.eq.${input}`) lets the caller add their own filters
          - pattern: $Q.or($FILTER, ...)
          - focus-metavariable: $FILTER

  - id: vibe.xss-sink
    message: Data from the page URL is rendered as HTML
    severity: ERROR
    languages: [javascript, typescript]
    metadata: {vibe: xss-sink}
    mode: taint
    pattern-sources: *request
    pattern-sanitizers:
      - pattern: DOMPurify.sanitize(...)
      - pattern: $P.sanitize(...)
      - pattern: sanitizeHtml(...)
      - pattern: sanitize(...)
      - pattern: xss(...)
      - pattern: escapeHtml(...)
      - pattern: encodeURIComponent(...)
    pattern-sinks:
      - patterns:
          - pattern: "<$EL dangerouslySetInnerHTML={{__html: $HTML}} />"
          - focus-metavariable: $HTML
      - patterns:
          - pattern-either:
              - pattern: $E.innerHTML = $HTML
              - pattern: $E.outerHTML = $HTML
              - pattern: $E.insertAdjacentHTML($POS, $HTML)
              - pattern: document.write($HTML)
              - pattern: document.writeln($HTML)
              - pattern: $J(...).html($HTML)
          - focus-metavariable: $HTML
      - patterns:  # server-side: echoing request data into an HTML response
          - pattern-either:
              - pattern: $RES.send($HTML)
              - pattern: $RES.write($HTML)
          - metavariable-pattern:
              metavariable: $HTML
              patterns:
                - pattern-regex: (?i)<[a-z!/]
          - focus-metavariable: $HTML

  - id: vibe.eval-user-input
    message: Request data is run as code
    severity: ERROR
    languages: [javascript, typescript]
    metadata: {vibe: eval-user-input}
    mode: taint
    pattern-sources: *request
    pattern-sanitizers: *numbers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: eval($CODE)
              - pattern: new Function(..., $CODE)
              - pattern: Function(..., $CODE)
              - pattern: setTimeout($CODE, ...)
              - pattern: setInterval($CODE, ...)
              - pattern: $VM.runInNewContext($CODE, ...)
              - pattern: $VM.runInThisContext($CODE, ...)
              - pattern: $VM.runInContext($CODE, ...)
              - pattern: new $VM.Script($CODE, ...)
          - focus-metavariable: $CODE

  - id: vibe.eval-user-input.command
    message: Request data is run as a shell command
    severity: ERROR
    languages: [javascript, typescript]
    metadata: {vibe: eval-user-input, variant: command}
    mode: taint
    pattern-sources: *request
    pattern-sanitizers: *numbers
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($CMD, ...)
              - pattern: $CP.execSync($CMD, ...)
              - pattern: exec($CMD, ...)
              - pattern: execSync($CMD, ...)
              - pattern: "$CP.spawn($CMD, ..., {..., shell: true, ...})"
          - focus-metavariable: $CMD
