id: supabase-getsession-on-server
language: tsx
severity: warning
message: Server code trusts supabase.auth.getSession()
# server-only places: Next.js middleware and route handlers, API routes, Edge Functions, *.server.* modules
files: ["**/middleware.*", "**/app/**/route.*", "**/pages/api/**", "**/supabase/functions/**", "**/*.server.*", "**/server/**"]
rule:
  pattern: $CLIENT.auth.getSession()
metadata: {vibe: supabase-getsession-on-server, confidence: Likely}
