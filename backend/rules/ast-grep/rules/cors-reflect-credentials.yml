id: cors-reflect-credentials
language: tsx
severity: error
message: CORS echoes any origin and allows credentials
rule:
  any:
    - all:  # cors({ origin: true | (o, cb) => cb(null, true), credentials: true })
        - pattern: cors($OPTS)
        - has: {kind: pair, regex: '^credentials\s*:\s*true', stopBy: end}
        - has: {kind: pair, regex: '^origin\s*:\s*(true\b|\(|function\b|async\b|\w+\s*=>)', stopBy: end}
    - all:  # res.setHeader("Access-Control-Allow-Origin", req.headers.origin) in a file that also allows credentials
        - kind: call_expression
        - regex: (?is)^\w+\.(set|setHeader|header|append)\(\s*["']access-control-allow-origin["']\s*,\s*[^"'\s)][^)]*origin
        - inside:
            kind: program
            stopBy: end
            regex: (?i)access-control-allow-credentials["']\s*[,:]\s*["']?true
metadata: {vibe: cors-wildcard, variant: reflect-credentials, confidence: Likely}
