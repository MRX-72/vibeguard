id: plaintext-password-store
language: tsx
severity: error
message: Passwords saved in plain text
files: ["**/server/**", "**/api/**", "**/routes/**", "**/supabase/functions/**", "**/*.server.*", "**/route.*", "**/functions/**", "**/backend/**", "**/controllers/**", "**/services/**", "**/auth.*"]
rule:
  kind: pair
  regex: '^(password|passwd|pwd)\s*:\s*(req\.body\.|request\.body\.|body\.|data\.|input\.)?(password|passwd|pwd)\b'
  inside:
    kind: call_expression
    regex: '\.(insert|create|update|upsert|save|set|insertOne)\('
    stopBy: end
  not:
    inside:
      kind: program
      regex: 'bcrypt|argon2|scrypt|pbkdf2|hashSync|\.hash\(|createHash|hashPassword'
      stopBy: end
metadata: {vibe: plaintext-password, variant: store, confidence: Likely}
