id: supabase-getsession-in-server-fn
language: tsx
severity: warning
message: Server code trusts supabase.auth.getSession()
rule:
  pattern: $CLIENT.auth.getSession()
  # TanStack Start server functions and Next.js server actions run on the server wherever the file lives
  inside:
    stopBy: end
    any:
      - kind: call_expression
        regex: ^createServerFn\b
      - kind: program
        regex: ^\s*(//[^\n]*\n\s*)*["']use server["']
metadata: {vibe: supabase-getsession-on-server, confidence: Likely}
