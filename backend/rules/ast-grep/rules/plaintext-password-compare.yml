id: plaintext-password-compare
language: tsx
severity: error
message: Passwords compared in plain text
files: ["**/server/**", "**/api/**", "**/routes/**", "**/supabase/functions/**", "**/*.server.*", "**/route.*", "**/functions/**", "**/backend/**", "**/controllers/**", "**/services/**", "**/auth.*"]
rule:
  kind: binary_expression
  # anchored, so `!user || user.password !== password` doesn't match a second time around the inner comparison
  regex: '(?i)^(user|row|account|record|member|admin|existing|found|result|data|u|dbuser|rows\[0\])\??\.(password|passwd|pwd)\s*(===|!==|==|!=)\s*\w+(\.\w+)*$|^\w+(\.\w+)*\s*(===|!==|==|!=)\s*(user|row|account|record|member|admin|existing|found|result|data|u|dbuser|rows\[0\])\??\.(password|passwd|pwd)$'
metadata: {vibe: plaintext-password, variant: compare, confidence: Likely}
