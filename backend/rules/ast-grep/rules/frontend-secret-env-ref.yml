id: frontend-secret-env-ref
language: tsx
severity: error
message: Browser code reads a secret from a public env var
ignores: ["**/server/**", "**/api/**", "**/supabase/functions/**", "**/*.server.*", "**/scripts/**", "**/middleware.*", "**/route.*", "**/*.config.*"]
rule:
  any:
    - pattern: import.meta.env.$VAR
    - pattern: process.env.$VAR
constraints:
  VAR:
    regex: ^(VITE_|NEXT_PUBLIC_|REACT_APP_|EXPO_PUBLIC_|PUBLIC_|NUXT_PUBLIC_|GATSBY_)\w*(SECRET|SERVICE_ROLE|PRIVATE|PASSWORD|OPENAI|ANTHROPIC|CLAUDE|GROQ|GEMINI|MISTRAL|COHERE|REPLICATE|ELEVENLABS|DEEPSEEK|PERPLEXITY|OPENROUTER|TOGETHER|HUGGING|HF_TOKEN|RESEND|SENDGRID|TWILIO|DATABASE_URL|DB_URL|ADMIN_(KEY|TOKEN))
    not:
      regex: PUBLISHABLE|ANON|PUBLIC_KEY|SITE_KEY|_ID$
metadata: {vibe: frontend-secret, variant: code-env, confidence: Likely}
