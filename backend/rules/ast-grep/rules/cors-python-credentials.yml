id: cors-python-credentials
language: python
severity: error
message: CORS echoes any origin and allows credentials
rule:
  kind: call
  any:
    - all:  # FastAPI / Starlette: a wildcard with credentials echoes the caller's origin when the request has cookies
        - regex: '(?s)^\w+\.add_middleware\(\s*CORSMiddleware'
        - has: {kind: keyword_argument, regex: '^allow_origins\s*=\s*\[\s*["'']\*["'']\s*\]', stopBy: end}
        - has: {kind: keyword_argument, regex: '^allow_credentials\s*=\s*True', stopBy: end}
    - all:  # flask-cors: supports_credentials with the default (any) origin echoes the caller's origin
        - regex: '^CORS\('
        - has: {kind: keyword_argument, regex: '^supports_credentials\s*=\s*True', stopBy: end}
        - not: {has: {kind: keyword_argument, regex: '^(origins|resources)\s*=', stopBy: end}}
metadata: {vibe: cors-wildcard, variant: python-credentials, confidence: Likely}
