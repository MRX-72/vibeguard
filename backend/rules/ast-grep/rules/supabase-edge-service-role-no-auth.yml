id: supabase-edge-service-role-no-auth
language: tsx
severity: error
message: Edge Function uses the service-role key without checking who's calling
files: ["**/supabase/functions/**"]
rule:
  pattern: Deno.env.get($KEY)
  inside:
    kind: program
    stopBy: end
    # any sign the function checks its caller: a user lookup, a JWT check, or reading the Authorization/secret header
    not:
      regex: (?i)auth\.(getUser|getClaims)\s*\(|jwtVerify|verifyJwt|jwt\.verify|headers\.get\(\s*["'](authorization|x-[a-z0-9-]*(secret|token|key|signature))["']
constraints:
  KEY:
    regex: SERVICE_ROLE|SECRET_KEY
metadata: {vibe: supabase-edge-service-role-no-auth, confidence: Likely}
